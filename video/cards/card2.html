<h1>How it works</h1>
<ol>
<li><b>Buyer</b> creates an escrow tied to a TapeOut circuit ID and funds it.</li>
<li><b>Seller</b> delivers — the contract checks the circuit exists on TapeOut and is owned by the seller.</li>
<li><b>Release:</b> buyer confirms, or auto-release after the challenge window. No delivery → refund.</li>
</ol>
